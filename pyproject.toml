[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trader"
version = "0.1.0"
description = "24/7 autonomous crypto trading agent: deterministic state engine + Jev reflex + hard risk layer"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
# Deep re-read escalation + nightly schema rewrite proposals (Claude Opus 5.5).
brain = ["anthropic>=0.70"]
# Live order routing. Paper trading needs none of this.
live = ["hyperliquid-python-sdk>=0.24", "eth-account>=0.10"]
dev = ["pytest>=8"]

[project.scripts]
trader = "trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
